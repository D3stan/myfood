name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TZ: Europe/Copenhagen # same as the Dockerfile; some tests depend on the zone

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: No skipped tests
        run: '! git grep -nE "\b(it|test|describe)\.(skip|todo)\b" -- tests'
      - run: npm test
      - run: npm run build # includes tsc --noEmit

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --build-arg BUILD_ID=${{ github.sha }} -t myfood:ci .
      - name: Boot and check /api/health
        run: |
          docker run -d --name app -p 3000:3000 myfood:ci
          for i in $(seq 30); do
            curl -fsS localhost:3000/api/health -o health.json && break
            sleep 1
          done
          cat health.json
          grep -q "${{ github.sha }}" health.json
      - if: failure()
        run: docker logs app

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
